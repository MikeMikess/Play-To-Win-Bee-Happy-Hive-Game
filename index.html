<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Happy Hive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #98D8C8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .game-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        @media (min-width: 768px) {
            .game-wrapper {
                max-width: 600px;
            }
        }

        @media (min-width: 1024px) {
            .game-wrapper {
                max-width: 700px;
            }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 0;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.3),
                0 0 0 8px rgba(255,255,255,0.5),
                inset 0 0 40px rgba(255,215,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(180deg, #FF8C42 0%, #FFAA1D 50%, #FFD93D 100%);
            padding: 15px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 20px rgba(255,140,66,0.4);
        }

        @media (min-width: 768px) {
            .header {
                padding: 25px;
            }
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 
                3px 3px 0px #D97706,
                4px 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            margin-bottom: 12px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        @media (min-width: 768px) {
            .title {
                font-size: 36px;
                margin-bottom: 18px;
            }
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }

        .stat-badge {
            background: white;
            border-radius: 20px;
            padding: 6px 12px;
            box-shadow: 
                0 4px 0 rgba(0,0,0,0.1),
                inset 0 2px 5px rgba(255,215,0,0.3);
            min-width: 70px;
            transition: transform 0.1s;
        }

        @media (min-width: 768px) {
            .stat-badge {
                padding: 10px 18px;
                min-width: 95px;
            }
        }

        .stat-icon {
            font-size: 18px;
            display: block;
        }

        @media (min-width: 768px) {
            .stat-icon {
                font-size: 24px;
            }
        }

        .stat-label {
            font-size: 9px;
            color: #8B4513;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 2px;
        }

        @media (min-width: 768px) {
            .stat-label {
                font-size: 11px;
            }
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #FF8C42;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        @media (min-width: 768px) {
            .stat-value {
                font-size: 22px;
            }
        }

        .content-area {
            padding: 12px;
        }

        @media (min-width: 768px) {
            .content-area {
                padding: 20px;
            }
        }

        .objective-container {
            background: linear-gradient(135deg, #FFEAA7 0%, #FDCB6E 100%);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 
                0 8px 0 #DAA520,
                0 12px 20px rgba(0,0,0,0.2);
        }

        .objective-title {
            text-align: center;
            font-weight: bold;
            color: #8B4513;
            font-size: 14px;
            margin-bottom: 8px;
        }

        @media (min-width: 768px) {
            .objective-title {
                font-size: 18px;
            }
        }

        .bee-container {
            position: relative;
            height: 120px;
            background: linear-gradient(180deg, #87CEEB 0%, #B4D7E8 100%);
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #4A90A4;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }

        @media (min-width: 768px) {
            .bee-container {
                height: 180px;
            }
        }

        .bee {
            position: absolute;
            font-size: 16px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
            animation: beeFloat 3s ease-in-out infinite;
        }

        @media (min-width: 768px) {
            .bee {
                font-size: 22px;
            }
        }

        @keyframes beeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .bee.removing {
            animation: beeFlyAway 0.15s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }

        @keyframes beeFlyAway {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(360deg) translateY(-50px);
                opacity: 0;
            }
        }

        .honey-pot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            text-align: center;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10;
        }

        .honey-pot.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .honey-pot-emoji {
            font-size: 50px;
            display: block;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.3));
            animation: honeyBounce 1s ease-in-out infinite;
        }

        @media (min-width: 768px) {
            .honey-pot-emoji {
                font-size: 80px;
            }
        }

        @keyframes honeyBounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .honey-pot-text {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 25px;
            margin-top: 6px;
            font-size: 10px;
            border: 2px solid white;
            box-shadow: 
                0 4px 0 #DAA520,
                0 8px 15px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @media (min-width: 768px) {
            .honey-pot-text {
                padding: 10px 18px;
                font-size: 13px;
            }
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: rgba(139,69,19,0.3);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #8B4513;
            position: relative;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 50%, #FFD700 100%);
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            transition: width 0.3s;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .grid-container {
            background: linear-gradient(135deg, #6A4C93 0%, #8B7AB8 100%);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 
                0 10px 0 #4A3570,
                0 15px 30px rgba(0,0,0,0.3);
            margin-top: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 15px;
        }

        @media (min-width: 768px) {
            .grid {
                gap: 10px;
                padding: 10px;
            }
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.9) 0%, 
                rgba(255,255,255,0.7) 100%);
            transition: all 0.1s;
            user-select: none;
            position: relative;
            box-shadow: 
                0 3px 0 rgba(0,0,0,0.2),
                inset 0 2px 5px rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.8);
        }

        @media (min-width: 768px) {
            .cell {
                font-size: 42px;
            }
        }

        .cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .cell.selected {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            transform: scale(1.15);
            animation: selectedPulse 0.6s infinite;
            z-index: 15;
        }

        @keyframes selectedPulse {
            0%, 100% { transform: scale(1.15); }
            50% { transform: scale(1.2); }
        }

        .cell.matching {
            animation: matchPop 0.1s forwards;
            z-index: 20;
        }

        @keyframes matchPop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Power-up styles */
        .cell.striped-h::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 3px;
            background: white;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        .cell.striped-v::before {
            content: '';
            position: absolute;
            width: 3px;
            height: 80%;
            background: white;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        .cell.wrapped::after {
            content: '🎁';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 16px;
        }

        .cell.colorbomb {
            background: radial-gradient(circle, #FF69B4, #8A2BE2);
            animation: bombGlow 1s infinite;
        }

        @keyframes bombGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255,105,180,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,105,180,1); }
        }

        .cell.bee-power::after {
            content: '🐝';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 18px;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            padding: 20px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
            z-index: 1000;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 3px solid white;
            text-align: center;
            max-width: 90vw;
        }

        @media (min-width: 768px) {
            .message {
                padding: 30px 50px;
                font-size: 26px;
            }
        }

        .message.show {
            animation: messagePopIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes messagePopIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .message.success {
            background: linear-gradient(135deg, #00D2FF 0%, #3A47D5 100%);
            color: white;
        }

        .message.info {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
        }

        .message.powerup {
            background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 100%);
            color: white;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .btn {
                padding: 14px;
                font-size: 14px;
            }
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .btn-primary { background: linear-gradient(135deg, #FF6B6B, #C44569); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #48C9B0, #1BBC9B); color: white; }
        .btn-music { background: linear-gradient(135deg, #9B59B6, #8E44AD); color: white; }
        .btn-track { background: linear-gradient(135deg, #E74C3C, #C0392B); color: white; }

        .confetti {
            position: fixed;
            font-size: 25px;
            pointer-events: none;
            z-index: 1001;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            from { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        .celebration-overlay.active {
            display: block;
        }
        .free-tray { margin-top: 12px; padding: 10px; border-radius: 16px; text-align: center; font-weight: bold; font-size: 13px; color: #8B4513; background: #fff3c4; border: 2px dashed #DAA520; touch-action: none; user-select: none; opacity: 0.6; }
        .free-tray.has { opacity: 1; cursor: grab; background: linear-gradient(135deg, #FFD700, #FFA500); animation: bombGlow 1s infinite; }
        .free-tray.armed { outline: 3px solid #FF6B9D; }
